<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odliczanie do urodzin Bartka</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: clamp(24px, 5vw, 48px);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 680px;
    }
    h1 {
      margin-bottom: clamp(20px, 4vw, 32px);
      font-size: clamp(1.35rem, 4vw, 2.2rem);
      line-height: 1.3;
    }
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(10px, 2.5vw, 20px);
    }
    .time-box {
      background: rgba(0, 0, 0, 0.3);
      padding: clamp(14px, 3vw, 24px) clamp(8px, 2vw, 16px);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .number {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: bold;
      line-height: 1.1;
    }
    .label {
      font-size: clamp(0.7rem, 2vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
      color: #cbd5e1;
    }

    @media (max-width: 480px) {
      .countdown {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .time-box {
        padding: 18px 10px;
      }
      .number {
        font-size: 2.4rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="title">Odliczanie do urodzin Bartka (23 listopada)</h1>
    <div class="countdown" id="countdown">
      <div class="time-box">
        <span class="number" id="days">0</span>
        <span class="label">Dni</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">0</span>
        <span class="label">Godzin</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">0</span>
        <span class="label">Minut</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">0</span>
        <span class="label">Sekund</span>
      </div>
    </div>
  </div>

  <script>
    function updateCountdown() {
      const now = new Date();
      let currentYear = now.getFullYear();
      let targetDate = new Date(currentYear, 10, 23, 0, 0, 0);

      if (now.getMonth() === 10 && now.getDate() === 23) {
        document.getElementById('title').innerText = "Wszystkiego najlepszego z okazji urodzin, Bartek!";
        document.getElementById('countdown').style.display = 'none';
        return;
      }

      if (now > targetDate) {
        targetDate = new Date(currentYear + 1, 10, 23, 0, 0, 0);
      }

      const diff = targetDate - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('days').innerText = days;
      document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
      document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
